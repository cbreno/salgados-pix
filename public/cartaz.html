<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartaz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23FFC93C%22/%3E%3Cpath d=%22M13 3 5 14h6l-1 7 8-11h-6l1-7z%22 fill=%22%232B2118%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 20px; padding: 20px 16px; }
    .barra-aviso {
      max-width: 640px; padding: 10px 14px; font-weight: 700; font-size: .95rem;
      background: var(--branco); border: 3px dashed var(--vermelho); border-radius: 14px;
    }
    .palco { overflow-x: auto; padding: 0 16px 48px; }

    .folha {
      width: 210mm; height: 297mm; margin: 0 auto; padding: 12mm;
      display: flex; flex-direction: column; gap: 6mm; overflow: hidden;
      background: var(--amarelo); color: var(--marrom);
      box-shadow: 0 0 0 1px rgba(43, 33, 24, .15), 10px 10px 0 var(--marrom);
    }

    .c-topo { display: flex; align-items: center; justify-content: space-between; gap: 6mm; }
    .c-loja { font-size: 22pt; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
    .c-pilula {
      display: inline-flex; align-items: center; gap: 2mm; flex: none;
      padding: 2.5mm 5mm; border-radius: 999px; background: var(--marrom); color: var(--amarelo);
      font-weight: 900; font-size: 13pt;
    }
    .c-pilula .ico { width: 6mm; height: 6mm; fill: var(--amarelo); }

    .folha h1 { font-size: 46pt; line-height: .95; letter-spacing: -0.045em; }
    .folha h1 span { color: var(--vermelho); }
    .c-lista {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 3mm; margin-top: -1mm;
      padding: 3mm 6mm; background: var(--creme); border: 1.2mm solid var(--marrom); border-radius: 5mm;
      box-shadow: 2mm 2mm 0 var(--marrom); font-size: 18pt; font-weight: 800; line-height: 1.1; transform: rotate(-1.5deg);
    }
    .c-lista strong { font-weight: 900; color: var(--vermelho); }
    .c-lista .ico { width: 8mm; height: 8mm; }

    .c-qr-area { flex: 1; display: grid; grid-auto-flow: column; place-content: center; gap: 8mm; }
    .c-qr, .c-nfc {
      position: relative; padding: 5mm 5mm 4mm; text-align: center;
      background: var(--branco); border: 2mm solid var(--marrom); border-radius: 8mm;
      box-shadow: 4mm 4mm 0 var(--marrom);
    }
    .c-qr #qr { width: 96mm; height: 96mm; }
    .c-nfc {
      width: 64mm; background: var(--creme);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4mm;
    }
    .c-nfc-alvo {
      display: grid; place-items: center; width: 48mm; height: 48mm; border-radius: 50%;
      border: 1.2mm dashed var(--marrom); background: var(--branco);
    }
    .c-nfc-alvo .ico { width: 24mm; height: 24mm; stroke-width: 2.2; }
    .c-nfc-titulo { font-weight: 900; font-size: 14pt; line-height: 1.1; }
    .c-nfc-sub { font-weight: 700; font-size: 10.5pt; line-height: 1.3; }
    .c-qr #qr svg { display: block; width: 100%; height: 100%; }
    .c-qr #qr.sem-qr { display: grid; place-items: center; font-size: 18pt; font-weight: 900; word-break: break-all; }
    .c-qr-legenda { margin-top: 2mm; font-weight: 900; font-size: 14pt; }
    .c-qr-url { font-weight: 700; font-size: 11pt; }
    .c-selo {
      position: absolute; top: -8mm; right: -6mm; padding: 3mm 5mm; z-index: 1;
      background: var(--vermelho); color: var(--creme);
      border: 1.2mm solid var(--marrom); border-radius: 5mm; box-shadow: 2mm 2mm 0 var(--marrom);
      font-weight: 900; font-size: 15pt; text-transform: uppercase; line-height: 1; transform: rotate(8deg);
    }

    .c-produtos { display: grid; grid-template-columns: 1fr 1fr; gap: 7mm; }
    .c-produto {
      display: flex; align-items: center; gap: 4mm; padding: 5mm;
      border: 1.5mm solid var(--marrom); border-radius: 7mm; box-shadow: 3mm 3mm 0 var(--marrom);
    }
    .c-produto.cor-salgado { background: var(--creme); } /* amarelo some na folha amarela */
    .c-produto .icone {
      display: grid; place-items: center; width: 16mm; height: 16mm; flex: none;
      background: var(--creme); color: var(--marrom); border: 1mm solid var(--marrom); border-radius: 4mm;
    }
    .c-produto .icone .ico { width: 10mm; height: 10mm; }
    .c-produto-nome { display: block; font-size: 15pt; font-weight: 800; line-height: 1.1; }
    .c-produto-preco { display: block; font-size: 30pt; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }

    .c-chave {
      padding: 3mm 5mm; text-align: center; font-size: 10.5pt; line-height: 1.4;
      background: var(--creme); border: .8mm dashed var(--marrom); border-radius: 4mm;
    }
    .c-chave strong { font-weight: 900; }

    @page { size: A4; margin: 0; }
    @media print {
      body { background: none; }
      .barra { display: none; }
      .palco { padding: 0; overflow: visible; }
      .folha { margin: 0; box-shadow: none; }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"
    integrity="sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz" crossorigin="anonymous"></script>
  <script type="module">
    import { nomeLoja, chavePix, nomeRecebedor, urlSite, produtos } from "./config.js";
    import { brl, ICONES } from "./comum.js";

    const $ = (s) => document.querySelector(s);
    const url = urlSite || new URL("./", location.href).href;

    document.title = `Cartaz | ${nomeLoja}`;
    $("#c-loja").textContent = nomeLoja;
    $("#c-url").textContent = url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    $("#c-chave").textContent = chavePix;
    $("#c-recebedor").textContent = nomeRecebedor;

    $("#c-produtos").innerHTML = produtos
      .map((p) => `
        <div class="c-produto cor-${ICONES[p.id] ? p.id : "padrao"}">
          <span class="icone">${ICONES[p.id] ?? ICONES.salgado}</span>
          <span><span class="c-produto-nome">${p.nome}</span><span class="c-produto-preco">${brl(p.preco)}</span></span>
        </div>`)
      .join("");

    const qrEl = $("#qr");
    if (window.qrcode) {
      const qr = window.qrcode(0, "M");
      qr.addData(url);
      qr.make();
      qrEl.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true, title: `QR code para ${url}` });
    } else {
      qrEl.classList.add("sem-qr");
      qrEl.textContent = url;
    }

    if (!urlSite && /^(localhost|127\.|192\.168\.|10\.)|^$/.test(location.hostname)) {
      const aviso = $("#aviso");
      aviso.hidden = false;
      aviso.textContent = `Atenção: o QR está apontando para ${url}, que só funciona neste computador. Abra o cartaz no endereço da Vercel ou preencha urlSite no config.js antes de imprimir.`;
    }

    $("#imprimir").addEventListener("click", () => window.print());
  </script>
</head>
<body>
  <div class="barra">
    <button class="btn btn-escuro" id="imprimir" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>
      Imprimir cartaz
    </button>
    <p class="barra-aviso" id="aviso" role="status" hidden></p>
  </div>

  <div class="palco">
    <main class="folha">
      <div class="c-topo">
        <span class="c-loja" id="c-loja"></span>
        <span class="c-pilula">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
          Pague no Pix
        </span>
      </div>

      <h1>Pegou? Escaneie e <span>pague pelo Pix</span></h1>
      <p class="c-lista">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
        <span><strong>Pagode?</strong> Anote seu nome na lista.</span>
      </p>

      <div class="c-qr-area">
        <div class="c-qr">
          <div id="qr"></div>
          <p class="c-qr-legenda">Aponte a câmera do celular</p>
          <p class="c-qr-url" id="c-url"></p>
        </div>
        <div class="c-nfc">
          <span class="c-selo">Pix na hora</span>
          <span class="c-nfc-alvo">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 0 7M9.5 6a10 10 0 0 1 0 12M13 3.5a14 14 0 0 1 0 17M16.5 1.5a18 18 0 0 1 0 21"/></svg>
          </span>
          <p class="c-nfc-titulo">Ou aproxime o celular</p>
          <p class="c-nfc-sub">Encoste o celular no círculo<br>(NFC ligado)</p>
        </div>
      </div>

      <div class="c-produtos" id="c-produtos"></div>

      <p class="c-chave">
        Prefere pagar manualmente? Chave Pix: <strong id="c-chave"></strong><br>
        Recebedor: <span id="c-recebedor"></span>
      </p>
    </main>
  </div>
</body>
</html>
